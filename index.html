<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0E1116">
<title>Spotify Now Playing — prova</title>

<!-- ════════════════════════════════════════════════════════════════
     ►►► BLOC 1 de 3 — ESTILS de la franja (va dins el teu <style>)
     ════════════════════════════════════════════════════════════════ -->
<style>
  :root{
    --bg:#0E1116; --panel:#161B22; --line:#252C36;
    --ink:#E8EEF4; --dim:#8595A6; --spotify:#1DB954;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }

  /* ---- Franja Now Playing ---- */
  #npBar{
    position:sticky;top:0;z-index:50;
    height:56px;display:flex;align-items:center;gap:12px;
    padding:8px 14px;
    padding-top:calc(8px + env(safe-area-inset-top)); /* respecta el notch */
    height:calc(56px + env(safe-area-inset-top));
    background:rgba(22,27,34,.92);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    overflow:hidden;
  }
  #npArt{
    width:40px;height:40px;border-radius:8px;flex:0 0 auto;
    background:#0b0e12 center/cover no-repeat;
    box-shadow:0 1px 4px rgba(0,0,0,.4);
  }
  #npMeta{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
  #npTitle{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #npArtist{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #npIcon{flex:0 0 auto;color:var(--spotify);display:flex;align-items:center}

  /* botó de connectar (quan encara no hi ha sessió) */
  #npConnect{
    margin-left:auto;flex:0 0 auto;
    background:var(--spotify);color:#062b13;border:none;border-radius:20px;
    padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;
  }
  /* barra de progrés a baix de tot de la franja */
  #npProg{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--spotify);transition:width .9s linear}

  /* estats */
  #npBar.idle #npTitle{color:var(--dim)}
  .npHidden{display:none !important}

  /* (decoració de la pàgina de prova, NO cal copiar-ho) */
  .demoBody{padding:24px;color:var(--dim);font-size:14px;line-height:1.6}
</style>
</head>
<body>

<!-- ════════════════════════════════════════════════════════════════
     ►►► BLOC 2 de 3 — HTML de la franja (posa'l com a PRIMER element del <body>)
     ════════════════════════════════════════════════════════════════ -->
<div id="npBar" class="idle">
  <div id="npArt"></div>
  <div id="npMeta">
    <div id="npTitle">No connectat a Spotify</div>
    <div id="npArtist">Prem el botó per vincular el teu compte</div>
  </div>
  <div id="npIcon" class="npHidden">
    <!-- icona Spotify -->
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0a12 12 0 100 24 12 12 0 000-24zm5.5 17.3a.75.75 0 01-1 .25c-2.8-1.7-6.3-2.1-10.4-1.1a.75.75 0 11-.34-1.46c4.5-1 8.3-.6 11.5 1.3.36.22.47.69.25 1.02zm1.5-3.3a.94.94 0 01-1.3.3c-3.2-2-8.1-2.5-11.9-1.4a.94.94 0 11-.54-1.8c4.3-1.3 9.7-.7 13.4 1.6.44.27.58.85.3 1.3zm.13-3.4C15.4 8.2 9 8 5.4 9.1a1.12 1.12 0 11-.66-2.15C8.9 5.7 16 5.9 20.3 8.5a1.12 1.12 0 11-1.17 1.9z"/></svg>
  </div>
  <button id="npConnect">♪ Connecta Spotify</button>
  <div id="npProg"></div>
</div>

<!-- ↓↓↓ això és només contingut de prova perquè vegis la franja a dalt ↓↓↓ -->
<div class="demoBody">
  <p>Aquesta és la pàgina aïllada de prova. Quan la franja de dalt et mostri la cançó que sona, ja saps que la connexió va bé i podrem moure els 3 blocs marcats al teu <code>inclinometre-moto.html</code>.</p>
</div>

<!-- ════════════════════════════════════════════════════════════════
     ►►► BLOC 3 de 3 — LÒGICA (posa-la abans del </body>)
         👉 NOMÉS has de canviar CLIENT_ID per la teva.
     ════════════════════════════════════════════════════════════════ -->
<script>
const SPOTIFY = (() => {
  // ──────────── CONFIGURA AIXÒ ────────────
  const CLIENT_ID = "POSA_AQUI_EL_TEU_CLIENT_ID";
  // ─────────────────────────────────────────
  const SCOPES   = "user-read-currently-playing user-read-playback-state";
  // El redirect ha de coincidir EXACTAMENT amb el que registris al panell de Spotify.
  // Fem servir l'URL actual sense paràmetres ni #.
  const REDIRECT = location.origin + location.pathname;

  const $ = id => document.getElementById(id);
  const ls = localStorage;

  // ---- utils PKCE ----
  const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  async function sha256(str){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  }
  function makeVerifier(){
    const a = new Uint8Array(64); crypto.getRandomValues(a);
    return b64url(a.buffer);
  }

  // ---- login (redirigeix a Spotify) ----
  async function login(){
    if(CLIENT_ID.startsWith("POSA_AQUI")){
      alert("Falta posar el teu CLIENT_ID dins l'script.");
      return;
    }
    const verifier = makeVerifier();
    ls.setItem('sp_verifier', verifier);
    const challenge = b64url(await sha256(verifier));
    const p = new URLSearchParams({
      client_id: CLIENT_ID, response_type:'code', redirect_uri: REDIRECT,
      scope: SCOPES, code_challenge_method:'S256', code_challenge: challenge
    });
    location.href = 'https://accounts.spotify.com/authorize?' + p.toString();
  }

  // ---- tornada de Spotify amb ?code=... ----
  async function handleRedirect(){
    const code = new URLSearchParams(location.search).get('code');
    if(!code) return;
    const verifier = ls.getItem('sp_verifier');
    const body = new URLSearchParams({
      client_id: CLIENT_ID, grant_type:'authorization_code', code,
      redirect_uri: REDIRECT, code_verifier: verifier
    });
    const r = await fetch('https://accounts.spotify.com/api/token',{
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body });
    store(await r.json());
    history.replaceState({}, '', REDIRECT); // neteja l'URL
  }

  function store(t){
    if(!t || !t.access_token) return;
    ls.setItem('sp_access', t.access_token);
    ls.setItem('sp_expires', String(Date.now() + t.expires_in*1000 - 60000));
    if(t.refresh_token) ls.setItem('sp_refresh', t.refresh_token);
  }
  async function refresh(){
    const rt = ls.getItem('sp_refresh'); if(!rt) return false;
    const body = new URLSearchParams({
      client_id: CLIENT_ID, grant_type:'refresh_token', refresh_token: rt });
    const r = await fetch('https://accounts.spotify.com/api/token',{
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body });
    store(await r.json());
    return !!ls.getItem('sp_access');
  }
  async function token(){
    if(!ls.getItem('sp_access')) return null;
    if(Date.now() > (+ls.getItem('sp_expires')||0)){ await refresh(); }
    return ls.getItem('sp_access');
  }

  // ---- render de la franja ----
  function showConnect(){
    $('npBar').classList.add('idle');
    $('npConnect').classList.remove('npHidden');
    $('npIcon').classList.add('npHidden');
    $('npArt').style.backgroundImage='';
    $('npTitle').textContent='No connectat a Spotify';
    $('npArtist').textContent='Prem el botó per vincular el teu compte';
    $('npProg').style.width='0';
  }
  function showIdle(){
    $('npBar').classList.add('idle');
    $('npConnect').classList.add('npHidden');
    $('npIcon').classList.remove('npHidden');
    $('npArt').style.backgroundImage='';
    $('npTitle').textContent='Res sonant ara mateix';
    $('npArtist').textContent='Posa música a Spotify';
    $('npProg').style.width='0';
  }
  function render(d){
    if(!d || !d.item){ showIdle(); return; }
    $('npBar').classList.remove('idle');
    $('npConnect').classList.add('npHidden');
    $('npIcon').classList.remove('npHidden');
    const it = d.item;
    const art = it.album?.images?.slice(-1)[0]?.url || it.album?.images?.[0]?.url;
    $('npArt').style.backgroundImage = art ? `url("${art}")` : '';
    $('npTitle').textContent = it.name || '—';
    $('npArtist').textContent = (it.artists||[]).map(a=>a.name).join(', ') || '';
    const pct = it.duration_ms ? Math.min(100, 100*d.progress_ms/it.duration_ms) : 0;
    $('npProg').style.width = pct + '%';
  }

  // ---- bucle de sondeig ----
  async function poll(){
    const tk = await token();
    if(!tk){ showConnect(); return; }
    try{
      const r = await fetch('https://api.spotify.com/v1/me/player/currently-playing',{
        headers:{ Authorization:'Bearer '+tk } });
      if(r.status===204){ showIdle(); return; }   // res reproduint-se
      if(r.status===401){ await refresh(); return; }
      if(!r.ok) return;
      render(await r.json());
    }catch(e){ /* xarxa: ignora i reintenta al següent tic */ }
  }

  // ---- arrencada ----
  async function init(){
    $('npConnect').addEventListener('click', login);
    await handleRedirect();
    poll();
    setInterval(poll, 5000);   // refresca cada 5 s
  }
  return { init };
})();
document.addEventListener('DOMContentLoaded', SPOTIFY.init);
</script>
</body>
</html>
